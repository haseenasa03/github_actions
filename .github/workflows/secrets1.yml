name: Testing Another Secret

on:
  workflow_dispatch:

jobs:
  test_secret:
    runs-on: ubuntu-latest
    steps:
      - name: Check database password
        env:
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          if [ -n "$DB_PASSWORD" ]; then
            echo "Database password is configured"
          else
            echo "Database password is missing"
            exit 1
          fi
