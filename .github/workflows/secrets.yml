
name: Testing Secret Variables

on:
  workflow_dispatch:

jobs:
  test_context_variables:
    runs-on: ubuntu-latest

    steps:
      - name: Checking Secret Variable
        env:
          MY_KEY: ${{ secrets.MY_KEY }}
        run: |
          if [ -n "$MY_KEY" ]; then
            echo "Secret is available"
          else
            echo "Secret is missing"
            exit 1
          fi
